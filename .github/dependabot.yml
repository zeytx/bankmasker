version: 2
updates:
  # Minor/patch updates arrive grouped in one PR; each major update gets its
  # own PR so a breaking upgrade (e.g. Spring Boot 4, JUnit 6) never blocks
  # the safe ones.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The starter is built against the oldest supported Spring Boot line;
      # Spring Boot 4 is covered by the CI job using -Pspring-boot-4
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
