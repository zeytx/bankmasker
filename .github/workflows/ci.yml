name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 17, 21, 25 ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build & Test all modules
        run: ./mvnw -B clean verify

      - name: Upload coverage report
        if: matrix.java == 17
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: bankmasker-core/target/site/jacoco/

      - name: Upload benchmark jar
        if: matrix.java == 17
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-jar
          path: bankmasker-benchmark/target/bankmasker-benchmark-*-SNAPSHOT.jar

  spring-boot-4:
    name: Spring Boot 4
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Test the starter and logging integrations against Spring Boot 4
        run: ./mvnw -B clean verify -Pspring-boot-4 -pl bankmasker-spring-boot-starter,bankmasker-logging -am

  # The release build minus signing and upload, on every change: a bundle that
  # Central would reject (as with Maven 3.10 in 1.3.0) fails here, not at tag time
  release-bundle:
    name: Release bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Build the Maven Central bundle without uploading it
        run: |
          # Snapshots are not bundled: use the upcoming release version
          VERSION=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout -N)
          ./mvnw -B -q org.codehaus.mojo:versions-maven-plugin:2.19.1:set \
            -DnewVersion="${VERSION%-SNAPSHOT}" -DgenerateBackupPoms=false
          ./mvnw -B clean deploy -Prelease -pl '!bankmasker-benchmark' -DskipTests -Dgpg.skip -DskipUpload=true

      - name: Check the bundle against Central's layout rules
        run: |
          python3 - target/central-publishing/central-bundle.zip <<'EOF'
          import collections, sys, zipfile

          names = [n for n in zipfile.ZipFile(sys.argv[1]).namelist() if not n.endswith('/')]
          dirs = collections.defaultdict(set)
          for name in names:
              directory, _, file = name.rpartition('/')
              dirs[directory].add(file)

          # Local-repository bookkeeping that Maven 3.10 writes into the staging directory
          bookkeeping = {'_remote.repositories', 'maven-metadata-local.xml'}
          errors = [f"local repository file in the bundle: {n}" for n in names
                    if n.rpartition('/')[2] in bookkeeping or '/.locks/' in n or n.startswith('.locks/')]
          for directory, files in sorted(dirs.items()):
              base = '-'.join(directory.split('/')[-2:])  # artifactId-version
              if base + '.pom' not in files:
                  errors.append(f"{directory}: no {base}.pom, Central rejects it: {sorted(files)}")
                  continue
              if base + '.jar' in files:
                  for classifier in ('sources', 'javadoc'):
                      if f"{base}-{classifier}.jar" not in files:
                          errors.append(f"{directory}: missing {base}-{classifier}.jar")
              print(f"ok {directory}: {len(files)} files")

          if not dirs:
              errors.append("the bundle is empty")
          if errors:
              sys.exit("\n".join(errors))
          EOF
