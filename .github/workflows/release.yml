name: Release to Maven Central

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance attestations (Sigstore)
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Set release version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not a vX.Y.Z release tag" >&2
            exit 1
          fi
          echo "Release version: $VERSION"
          ./mvnw -B -v
          ./mvnw -B org.codehaus.mojo:versions-maven-plugin:2.19.1:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build, Test & Publish to Maven Central
        run: ./mvnw clean deploy -Prelease -pl !bankmasker-benchmark -B
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bankmasker-core/target/bankmasker-core-*.jar
            bankmasker-logging/target/bankmasker-logging-*.jar
            bankmasker-spring-boot-starter/target/bankmasker-spring-boot-starter-*.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            bankmasker-core/target/bankmasker-core-*.jar
            bankmasker-logging/target/bankmasker-logging-*.jar
            bankmasker-spring-boot-starter/target/bankmasker-spring-boot-starter-*.jar
            */target/*-cyclonedx.json
            target/*-cyclonedx.json
